# SonarCloud analysis (run by the `sonar` job in .github/workflows/ci.yml).
# Create the project on sonarcloud.io first and add a SONAR_TOKEN repository secret.
sonar.organization=lodhiplaybits
sonar.projectKey=lodhiPlayBits_kjq7rw
sonar.projectName=WindSight

sonar.sources=backend/windsight,api,web/src
sonar.tests=backend/tests,web/src
sonar.test.inclusions=backend/tests/**,web/src/**/*.test.ts
sonar.exclusions=web/src/**/*.test.ts,web/src/vite-env.d.ts
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
# Produced by the backend and frontend jobs and passed in as artifacts.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
