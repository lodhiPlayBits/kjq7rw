name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix web ci
      # Same script developers run before every commit.
      - run: bash scripts/verify.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t windsight:ci .
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name ws -p 8000:8000 windsight:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health | grep -q '"actuals":1584' || { docker logs ws; exit 1; }
          curl -sf localhost:8000/ | grep -q '<div id="root">' || { docker logs ws; exit 1; }
